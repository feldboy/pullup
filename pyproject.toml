[project]
name = "gym-ai-agent"
version = "0.1.0"
description = "Intelligent AI Agent for Gym Customer Communication & Retention"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "GymAI Team" }
]
keywords = ["ai", "gym", "customer-service", "pydantic-ai", "telegram", "whatsapp"]

dependencies = [
    # Core Framework
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.12",
    
    # LLM Providers
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "httpx>=0.25.0",  # For OpenRouter
    
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    
    # Database
    "supabase>=2.0.0",
    "asyncpg>=0.29.0",
    "motor>=3.0.0",  # MongoDB async driver
    
    # Telegram Bot
    "python-telegram-bot>=20.0",
    
    # PDF Processing
    "pymupdf>=1.23.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "logfire>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
gym-agent = "gym_agent.main:main"
telegram-bot = "gym_agent.channels.telegram_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gym_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
